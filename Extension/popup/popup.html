<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ScreenSense Extension</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { width: 320px; padding: 14px; background: #ffffff; color: #1e293b; font-size: 13px; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .title { font-size: 15px; font-weight: 700; color: #0f172a; }
    .badge { padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
    .badge.connected { background: #dcfce7; color: #166534; }
    .badge.disconnected { background: #fee2e2; color: #991b1b; }
    .card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; margin-bottom: 12px; }
    .card-title { font-size: 11px; text-transform: uppercase; color: #64748b; font-weight: 600; margin-bottom: 6px; }
    .stat-row { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .stat-label { color: #64748b; }
    .stat-value { font-weight: 600; color: #0f172a; }
    .button { width: 100%; padding: 8px 12px; background: #2563eb; color: #ffffff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
    .button:hover { background: #1d4ed8; }
    .elements-preview { max-height: 160px; overflow-y: auto; margin-top: 8px; font-size: 11px; }
    .element-item { padding: 4px 6px; margin-bottom: 4px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 4px; }
    .element-tag { font-weight: 700; color: #2563eb; margin-right: 4px; }
    .element-pct { float: right; color: #16a34a; font-weight: 600; }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">ScreenSense Bridge</span>
    <span id="bridgeStatus" class="badge disconnected">Checking...</span>
  </div>

  <div class="card">
    <div class="card-title">Viewport Context</div>
    <div class="stat-row">
      <span class="stat-label">Page:</span>
      <span id="pageTitle" class="stat-value">-</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Visible Elements:</span>
      <span id="visibleCount" class="stat-value">0</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Viewport:</span>
      <span id="viewportDim" class="stat-value">-</span>
    </div>
  </div>

  <button id="syncBtn" class="button">Sync Context to macOS</button>

  <div class="elements-preview" id="previewList"></div>

  <script src="popup.js"></script>
</body>
</html>
